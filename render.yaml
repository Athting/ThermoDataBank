services:
  - type: web
    name: databank
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: MDB
      - key: MONGODB_COLLECTION
        value: Materials
      - key: CLIENT_ORIGIN
        value: "*"
